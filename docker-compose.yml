
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bookstore_db
    environment:
      POSTGRES_USER: bookstore_user
      POSTGRES_PASSWORD: bookstore_password
      POSTGRES_DB: bookstore_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore_user -d bookstore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bookstore_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://bookstore_user:bookstore_password@postgres:5432/bookstore_db
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bookstore_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

